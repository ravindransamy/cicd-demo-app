name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Docker tags
        id: docker-tags
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "IMAGE_TAG=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/cicd-demo-app:${{ steps.docker-tags.outputs.IMAGE_TAG }} \
            -t ghcr.io/${{ github.repository_owner }}/cicd-demo-app:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/cicd-demo-app:${{ steps.docker-tags.outputs.IMAGE_TAG }}
          docker push ghcr.io/${{ github.repository_owner }}/cicd-demo-app:${{ github.sha }}